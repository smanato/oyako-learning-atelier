<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>資料ダウンロード | AI教育ラボ Members</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body data-page="materials" data-base=".">
    <div class="app-shell">
      <aside class="sidebar" data-shell-sidebar aria-label="メンバーサイトナビゲーション"></aside>
      <main class="portal">
        <header class="topbar" data-shell-topbar></header>

        <section class="materials-intro section-block">
          <div class="section-head">
            <p class="eyebrow">Downloads</p>
            <h2>配布資料をここに保管しています</h2>
            <p>オープンチャットに投稿した資料は、一定期間が過ぎるとダウンロードできなくなります。セミナー資料や配布シートは、期限なくいつでも取り出せるようにこのページへまとめています。</p>
            <p class="materials-note">スマホの場合、ダウンロードした資料は「ファイル」アプリ（iPhone）や「Files / ダウンロード」（Android）に保存されます。うまく開けないときは、Zoom・質問ページから気軽にご質問ください。</p>
          </div>
        </section>

        <section class="materials section-block">
          <div class="material-groups" data-content-materials>
            <p class="materials-empty">資料は順次追加しています。もうしばらくお待ちください。</p>
          </div>
        </section>
      </main>
    </div>
    <div class="toast" role="status" aria-live="polite" data-toast></div>
    <script src="./content.js" defer></script>
    <script src="./shell.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
