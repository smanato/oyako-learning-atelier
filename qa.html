<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>オプチャQ&A | AI教育ラボ Members</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body data-page="qa" data-base=".">
    <div class="app-shell">
      <aside class="sidebar" data-shell-sidebar aria-label="メンバーサイトナビゲーション"></aside>
      <main class="portal">
        <header class="topbar" data-shell-topbar></header>

        <div data-qa-list-view>
          <section class="page-hero page-hero--image">
            <div>
              <p class="eyebrow">OpenChat Q&A</p>
              <h2>オプチャの質問、流さず資産に。</h2>
              <p>オープンチャットでいただいた質問と回答を、あとから探せる形で保管しています。日付・教科・学年・キーワードで絞り込めます。「あの話どこだっけ？」はここで解決してください。</p>
            </div>
            <img src="./assets/generated/question-box.png" alt="質問と回答が蓄積されていくイメージ">
          </section>

          <section class="section-block qa-filter" aria-label="Q&Aの絞り込み">
            <div class="section-head section-head--split">
              <div>
                <p class="eyebrow">Search &amp; Filter</p>
                <h2>質問をさがす</h2>
                <p>上の検索ボックスにキーワードを入れるか、チップで絞り込んでください。</p>
              </div>
              <button class="secondary secondary--light compact" type="button" data-qa-filter-reset>絞り込み解除</button>
            </div>
            <div class="qa-filter__row">
              <span class="qa-filter__label">教科</span>
              <div class="qa-filter__chips" data-qa-filter-subject></div>
            </div>
            <div class="qa-filter__row">
              <span class="qa-filter__label">学年</span>
              <div class="qa-filter__chips" data-qa-filter-grade></div>
            </div>
            <div class="qa-filter__row">
              <span class="qa-filter__label">時期</span>
              <div class="qa-filter__chips" data-qa-filter-month></div>
            </div>
            <p class="qa-filter__count" data-qa-count></p>
          </section>

          <section class="section-block">
            <div class="qa-list" data-content-qa-list></div>
          </section>
        </div>

        <div data-qa-detail-view hidden>
          <section class="section-block">
            <a class="qa-back" href="./qa.html">← Q&A一覧に戻る</a>
            <div data-content-qa-detail></div>
          </section>
        </div>
      </main>
    </div>
    <div class="toast" role="status" aria-live="polite" data-toast></div>
    <script src="./content.js" defer></script>
    <script src="./qa-content.js" defer></script>
    <script src="./shell.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
